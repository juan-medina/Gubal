name: Release

# Run from the Actions tab (or `gh workflow run release.yml`) when you want to ship. There is no
# tag-push trigger: the version lives in one place, Gubal.csproj's <Version>, and this workflow
# derives the tag from it instead of trusting a second, independently-typed copy to match.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from Gubal.csproj
        id: version
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' Gubal/Gubal.csproj)
          if [ -z "$version" ]; then
            echo "::error::Could not read <Version> from Gubal/Gubal.csproj"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Fail if this version was already released
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.version.outputs.version }} already exists. Bump <Version> in Gubal/Gubal.csproj before releasing."
            exit 1
          fi

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

  build-release:
    name: Build and release
    needs: prepare
    runs-on: windows-latest

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # windows-latest is not guaranteed to have .NET 10 preinstalled (or to keep it, once the
      # runner image rolls forward), so pin it explicitly rather than relying on whatever the
      # image happens to ship. goatcorp's own SamplePlugin template does the same.
      #
      # cache: true keys the NuGet global-packages cache on packages.lock.json's hash, so it is
      # safe with --locked-mode restore below: any real dependency change produces a different
      # key and restores fresh. It only searches the repo root by default, hence the explicit
      # path — Gubal/packages.lock.json, not one at the solution root.
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Gubal/packages.lock.json

      - name: Setup Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile ./latest.zip
          Expand-Archive -Path ./latest.zip -DestinationPath "$env:AppData\XIVLauncher\addon\Hooks\dev" -Force

      - name: Restore project dependencies
        run: dotnet restore Gubal.sln --locked-mode --verbosity normal

      - name: Build Release
        run: dotnet build Gubal.sln --no-restore --verbosity normal --configuration Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gubal-${{ needs.prepare.outputs.version }}
          path: |
            Gubal/bin/x64/Release
            !ItsGubalUp/bin/x64/Release/Gubal

      # The SDK always names the package latest.zip; copy it under a stable, plugin-named asset
      # instead so the release archive is identifiable on its own.
      - name: Rename package for release
        run: Copy-Item -Path Gubal/bin/x64/Release/Gubal/latest.zip -Destination Gubal/bin/x64/Release/Gubal/Gubal.zip

      # actions/create-release and actions/upload-release-asset (what LMeter's workflow uses) are
      # archived and unmaintained. softprops/action-gh-release does both in one actively-maintained
      # step — and never touching a branch (tag + release, nothing else) matches the sibling Godot
      # project's release.yml.
      - name: Create release and attach the plugin zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: Gubal ${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: false
          files: |
            Gubal/bin/x64/Release/Gubal/Gubal.zip
          fail_on_unmatched_files: true
